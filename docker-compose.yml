services:
  gloss:
    build: .
    image: gloss:latest
    container_name: gloss
    restart: unless-stopped
    env_file: .env
    ports:
      - "3100:3100"
    volumes:
      - gloss-data:/data
    networks:
      - default
      - web-core_default

volumes:
  gloss-data:

networks:
  web-core_default:
    external: true
